version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # ioredis-mock 8 requires ioredis 5 for the Redis integration tests.
      - dependency-name: ioredis
        versions: ["6.x"]
    groups:
      next-react:
        patterns:
          [
            "next",
            "react",
            "react-dom",
            "@types/react*",
            "babel-plugin-react-compiler",
          ]
      astryx:
        patterns: ["@astryxdesign/*", "@stylexjs/stylex"]
      vercel:
        patterns: ["@vercel/*"]
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
